<style>
  :root{
    --paper:#F2EEE5; --charcoal:#34322C; --ink:#201E1A; --red:#FF3131; --red-ink:#B31E1E;
    --steel:#837D6E; --steel-line:rgba(32,30,26,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'League Spartan',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .card{
    width:100%; max-width:380px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    gap:0;
  }
  .seal{ width:76px; margin-bottom:22px; }
  .seal svg{ width:100%; height:auto; display:block; }

  h1{
    margin:0; font-size:2rem; font-weight:800; letter-spacing:-0.01em; text-wrap:balance;
  }
  .role{
    margin-top:.5rem; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--red-ink); font-weight:600;
  }
  .tagline{
    margin-top:1.1rem; font-size:.95rem; line-height:1.6; color:var(--charcoal);
    max-width:30ch;
  }

  .actions{ width:100%; margin-top:2rem; display:flex; flex-direction:column; gap:.7rem; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    width:100%; padding:.95rem 1.2rem; border-radius:10px;
    font-family:'League Spartan',Arial,sans-serif; font-weight:700; font-size:.95rem;
    text-decoration:none; letter-spacing:.01em;
    border:1px solid transparent; cursor:pointer;
  }
  .btn svg{ width:18px; height:18px; flex-shrink:0; }
  .btn-primary{ background:var(--red); color:var(--paper); }
  .btn-secondary{ background:transparent; color:var(--ink); border-color:var(--steel-line); }

  .phone{
    margin-top:1.4rem; font-size:.85rem; color:var(--red-ink); text-decoration:none;
    border-bottom:1px solid rgba(179,30,30,0.3); padding-bottom:2px;
  }
  .phone + .phone{ margin-top:.6rem; }

  .note{
    margin-top:1.6rem; font-size:.7rem; color:var(--steel); max-width:28ch; line-height:1.5;
  }

  footer{
    margin-top:2.6rem; padding-top:1.6rem; border-top:1px solid var(--steel-line);
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  footer .lockup{ width:120px; }
  footer .lockup svg{ width:100%; height:auto; display:block; }
  footer .loc{ font-family:'IBM Plex Mono', monospace; font-size:.6rem; letter-spacing:.08em; color:var(--steel); text-transform:uppercase; }
</style>
</head>
